version: '3.8'

services:
  app:
    image: nginx:latest
    ports:
      - "8080:80"
    environment:
      NODE_ENV: "production"
    depends_on:
      - database
      - redis 
    networks:
      - app_network
    restart: always 

  database:
    image: postgres:alpine
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: my_database
    ports:
      - "5432:5432"
    networks:
      - app_network
    restart: always 

  redis:
    image: redis:alpine 
    command: redis-server --requirepass "redispass123"
    ports:
      - "6379:6379"
    networks:
      - app_network
    restart: always 

volumes:
  pg_data:
    driver: local 

networks:
  app_network:
    driver: bridge
